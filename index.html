<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JALLAD BIRTHDAY LINKS</title>

<meta name="description" content="JALLAD BIRTHDAY LINKS - Create and share beautiful birthday surprise links.">
<meta name="keywords" content="JALLAD BIRTHDAY LINKS, JALLAD Birthday, Birthday Links, Birthday Surprise">
<meta name="robots" content="index, follow">

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#app{
    width:100%;
    height:100%;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

#creator{
    width:100%;
    text-align:center;
}

.title{
    color:#ff69d9;
    font-size:34px;
    font-weight:bold;
    margin-bottom:28px;
    text-shadow:
    0 0 10px #ff69d9,
    0 0 30px #ff1493,
    0 0 60px #ff1493;
}

input,select{
    width:330px;
    max-width:85vw;
    padding:17px 20px;
    border-radius:40px;
    border:2px solid #ff69d9;
    background:#080808;
    color:white;
    outline:none;
    text-align:center;
    font-size:19px;
    box-shadow:
    0 0 15px #ff69d9,
    0 0 35px #ff1493;
}

select option{
    background:#080808;
}

button{
    display:block;
    margin:20px auto;
    padding:15px 32px;
    border:0;
    border-radius:40px;
    background:#ff1493;
    color:white;
    font-size:19px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:
    0 0 15px #ff1493,
    0 0 40px #ff1493;
}

button:hover{
    transform:scale(1.06);
}

#linkBox{
    display:none;
    color:white;
    margin-top:20px;
}

#generatedLink{
    width:min(700px,90vw);
    margin:15px auto;
    padding:14px;
    border:1px solid #ff69d9;
    border-radius:15px;
    color:#ff9be8;
    word-break:break-all;
    font-size:15px;
}

#pop{
    display:none;
    color:white;
    font-size:75px;
    font-weight:bold;
    text-shadow:
    0 0 15px white,
    0 0 40px #ff1493;
}

#balloons{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.balloon{
    position:absolute;
    bottom:-130px;
    width:52px;
    height:68px;
    border-radius:50%;
    cursor:pointer;
    pointer-events:auto;
    box-shadow:
    0 0 12px currentColor,
    0 0 25px currentColor;
    animation:up 10s linear forwards;
}

.balloon:after{
    content:"";
    position:absolute;
    top:66px;
    left:50%;
    width:2px;
    height:110px;
    background:white;
    opacity:.45;
}

@keyframes up{
    0%{transform:translateY(0) rotate(0)}
    25%{transform:translateY(-25vh) rotate(12deg)}
    50%{transform:translateY(-55vh) rotate(-12deg)}
    75%{transform:translateY(-85vh) rotate(12deg)}
    100%{transform:translateY(-125vh) rotate(-8deg)}
}

.particle{
    position:fixed;
    width:8px;
    height:8px;
    border-radius:50%;
    pointer-events:none;
    animation:particle .7s ease-out forwards;
}

@keyframes particle{
    0%{
        opacity:1;
        transform:translate(0,0) scale(1);
    }
    100%{
        opacity:0;
        transform:
        translate(
        calc(var(--x)*1px),
        calc(var(--y)*1px)
        )
        scale(.1);
    }
}

#surprise{
    display:none;
    padding:18px 32px;
    border:2px solid #ff69d9;
    border-radius:50px;
    color:white;
    background:#080808;
    font-size:23px;
    cursor:pointer;
    box-shadow:
    0 0 15px #ff69d9,
    0 0 40px #ff1493;
}

#cakeScene{
    display:none;
    perspective:1200px;
}

.cake{
    width:330px;
    height:320px;
    position:relative;
    transform-style:preserve-3d;
    animation:cake 2s infinite alternate ease-in-out;
}

@keyframes cake{
    from{
        transform:rotateX(15deg) rotateY(-18deg);
    }
    to{
        transform:rotateX(15deg) rotateY(18deg) translateY(-12px);
    }
}

.layer{
    position:absolute;
    border-radius:22px;
    background:
    linear-gradient(
    90deg,
    #5e176f,
    #a719a8,
    #ff3ccf,
    #ff91e8,
    #8e24aa
    );
    box-shadow:
    0 0 15px #ff1493,
    0 0 35px #ff1493,
    inset 0 12px 18px rgba(255,255,255,.4);
}

.layer1{
    width:290px;
    height:80px;
    left:20px;
    bottom:20px;
}

.layer2{
    width:245px;
    height:75px;
    left:42px;
    bottom:82px;
}

.layer3{
    width:200px;
    height:70px;
    left:65px;
    bottom:140px;
}

.frosting{
    position:absolute;
    width:42px;
    height:27px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 12px white,0 0 25px white;
}

.f1{left:72px;bottom:137px}
.f2{left:120px;bottom:132px}
.f3{left:168px;bottom:138px}
.f4{left:215px;bottom:132px}

.candle{
    position:absolute;
    width:25px;
    height:82px;
    left:151px;
    bottom:202px;
    border-radius:8px;
    background:
    repeating-linear-gradient(
    45deg,
    white 0 8px,
    #ff69d9 8px 16px
    );
    box-shadow:
    0 0 15px #ff69d9,
    0 0 30px #ff1493;
}

.flame{
    position:absolute;
    width:32px;
    height:45px;
    left:-4px;
    top:-40px;
    background:#ffb300;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    box-shadow:
    0 0 15px #ff9800,
    0 0 35px #ff5722;
    animation:flame .4s infinite alternate;
}

@keyframes flame{
    from{transform:rotate(-45deg) scale(1)}
    to{transform:rotate(-40deg) scale(1.18)}
}

#birthday{
    display:none;
    color:#ff69d9;
    font-size:70px;
    font-weight:bold;
    text-align:center;
    text-shadow:
    0 0 10px #ff69d9,
    0 0 30px #ff1493,
    0 0 70px #ff1493;
    animation:appear 1.5s ease forwards;
}

@keyframes appear{
    from{
        opacity:0;
        transform:scale(.2);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

#heartBox{
    display:none;
    position:absolute;
    inset:0;
    justify-content:center;
    align-items:center;
    opacity:0;
    transform:scale(.5);
    transition:1.5s;
}

#heartSvg{
    width:min(85vw,850px);
    height:min(80vh,700px);
}

.heartText{
    fill:#ff69d9;
    font-size:21px;
    font-weight:bold;
    letter-spacing:1px;
    filter:url(#glow);
}

#message{
    display:none;
    position:absolute;
    width:min(850px,90vw);
    color:white;
    text-align:center;
    font-size:21px;
    line-height:1.7;
    padding:25px;
    text-shadow:
    0 0 8px #ff69d9,
    0 0 20px #ff1493;
    animation:messageIn 2s ease forwards;
}

#messageTitle{
    color:#ff69d9;
    font-size:32px;
    font-weight:bold;
    margin-bottom:18px;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:600px){

    .title{
        font-size:25px;
    }

    input,select{
        width:280px;
        font-size:17px;
    }

    #pop{
        font-size:50px;
    }

    #birthday{
        font-size:38px;
    }

    #message{
        font-size:17px;
    }

    #messageTitle{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div id="app">

<div id="creator">

    <div class="title">
        🎂 CREATE A BIRTHDAY SURPRISE 🎂
    </div>

    <input
        id="name"
        type="text"
        maxlength="25"
        placeholder="Birthday boy/girl name"
    >

    <br><br>

    <select id="relation">

        <option value="">
            Who are they?
        </option>

        <option value="boyfriend">
            💗 Boyfriend
        </option>

        <option value="girlfriend">
            💕 Girlfriend
        </option>

        <option value="bestfriend">
            🫶 Best Friend
        </option>

        <option value="friend">
            👯 Friend
        </option>

        <option value="brother">
            👦 Brother
        </option>

        <option value="sister">
            👧 Sister
        </option>

    </select>

    <button id="create">
        CREATE BIRTHDAY LINK 💖
    </button>

    <div id="linkBox">

        <div>
            🎉 Your birthday link is ready!
        </div>

        <div id="generatedLink"></div>

        <button id="copy">
            COPY LINK 🔗
        </button>

    </div>

</div>

<div id="pop">
    POP POP 🎈
</div>

<div id="balloons"></div>

<div id="surprise">
    Click here for a surprise ✨
</div>

<div id="cakeScene">

    <div class="cake">

        <div class="layer layer1"></div>
        <div class="layer layer2"></div>
        <div class="layer layer3"></div>

        <div class="frosting f1"></div>
        <div class="frosting f2"></div>
        <div class="frosting f3"></div>
        <div class="frosting f4"></div>

        <div class="candle">

            <div
                class="flame"
                id="flame">
            </div>

        </div>

    </div>

</div>

<div id="birthday"></div>

<div id="heartBox">

<svg
    id="heartSvg"
    viewBox="0 0 900 700"
    xmlns="http://www.w3.org/2000/svg"
>

<defs>

<filter id="glow">

    <feGaussianBlur
        stdDeviation="3"
        result="blur">
    </feGaussianBlur>

    <feMerge>

        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>

    </feMerge>

</filter>

<path
    id="heartPath"
    d="
    M450 620
    C390 560 100 400 100 215
    C100 85 260 45 365 150
    C410 195 450 245 450 245
    C450 245 490 195 535 150
    C640 45 800 85 800 215
    C800 400 510 560 450 620
    Z
    "
></path>

</defs>

<text class="heartText">

<textPath
    id="heartTextPath"
    href="#heartPath"
></textPath>

</text>

</svg>

</div>

<div id="message">

    <div id="messageTitle"></div>

    <div id="messageText"></div>

</div>

</div>

<script>

const creator =
document.getElementById("creator");

const nameInput =
document.getElementById("name");

const relationInput =
document.getElementById("relation");

const createBtn =
document.getElementById("create");

const linkBox =
document.getElementById("linkBox");

const generatedLink =
document.getElementById("generatedLink");

const copyBtn =
document.getElementById("copy");

const pop =
document.getElementById("pop");

const balloons =
document.getElementById("balloons");

const surprise =
document.getElementById("surprise");

const cakeScene =
document.getElementById("cakeScene");

const flame =
document.getElementById("flame");

const birthday =
document.getElementById("birthday");

const heartBox =
document.getElementById("heartBox");

const heartTextPath =
document.getElementById("heartTextPath");

const message =
document.getElementById("message");

const messageTitle =
document.getElementById("messageTitle");

const messageText =
document.getElementById("messageText");

let birthdayName = "";
let relationship = "";

const params =
new URLSearchParams(
    window.location.search
);

const urlName =
params.get("name");

const urlRelation =
params.get("relation");

if(urlName && urlRelation){

    birthdayName =
        urlName;

    relationship =
        urlRelation;

    creator.style.display =
        "none";

    startBirthdayShow();

}

createBtn.onclick =
function(){

    const enteredName =
        nameInput.value.trim();

    const enteredRelation =
        relationInput.value;

    if(!enteredName){

        alert(
            "Birthday boy/girl ka naam enter karo."
        );

        return;
    }

    if(!enteredRelation){

        alert(
            "Relationship select karo."
        );

        return;
    }

    const base =
        window.location.origin +
        window.location.pathname;

    const newLink =
        base +
        "?name=" +
        encodeURIComponent(
            enteredName
        ) +
        "&relation=" +
        encodeURIComponent(
            enteredRelation
        );

    generatedLink.innerText =
        newLink;

    linkBox.style.display =
        "block";
};

copyBtn.onclick =
async function(){

    const link =
        generatedLink.innerText;

    try{

        await navigator.clipboard.writeText(
            link
        );

        copyBtn.innerText =
            "COPIED ✅";

        setTimeout(function(){

            copyBtn.innerText =
                "COPY LINK 🔗";

        },2000);

    }
    catch(error){

        alert(
            "Link ko manually copy kar lo."
        );

    }
};

function startBirthdayShow(){

    pop.style.display =
        "block";

    setTimeout(function(){

        pop.style.display =
            "none";

        createBalloons();

    },900);
}

const colors = [
    "#ff1744",
    "#ff4081",
    "#7c4dff",
    "#00e5ff",
    "#00e676",
    "#ffea00",
    "#ff9100",
    "#e040fb",
    "#ff1493",
    "#00ffff"
];

function createBalloons(){

    for(let i=0;i<150;i++){

        const balloon =
            document.createElement("div");

        balloon.className =
            "balloon";

        balloon.style.left =
            Math.random()*97+"%";

        balloon.style.background =
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ];

        balloon.style.color =
            balloon.style.background;

        balloon.style.animationDelay =
            Math.random()*5+"s";

        balloon.style.width =
            35+Math.random()*35+"px";

        balloon.style.height =
            48+Math.random()*45+"px";

        balloon.onclick =
        function(e){

            e.stopPropagation();

            popBalloon(balloon);

        };

        balloons.appendChild(balloon);
    }

    setTimeout(function(){

        surprise.style.display =
            "block";

    },5000);
}

function popBalloon(balloon){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const audio =
            new AudioContext();

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();

        oscillator.type =
            "sawtooth";

        oscillator.frequency.setValueAtTime(
            180,
            audio.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            40,
            audio.currentTime+.12
        );

        gain.gain.setValueAtTime(
            .35,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audio.currentTime+.15
        );

        oscillator.connect(gain);

        gain.connect(
            audio.destination
        );

        oscillator.start();

        oscillator.stop(
            audio.currentTime+.15
        );

    }
    catch(e){}

    const rect =
        balloon.getBoundingClientRect();

    const x =
        rect.left +
        rect.width/2;

    const y =
        rect.top +
        rect.height/2;

    balloon.style.animation =
        "none";

    balloon.style.transform =
        "scale(0)";

    balloon.style.opacity =
        "0";

    for(let i=0;i<15;i++){

        const p =
            document.createElement("div");

        p.className =
            "particle";

        p.style.left =
            x+"px";

        p.style.top =
            y+"px";

        p.style.background =
            balloon.style.background;

        p.style.setProperty(
            "--x",
            Math.random()*180-90
        );

        p.style.setProperty(
            "--y",
            Math.random()*180-90
        );

        document.body.appendChild(p);

        setTimeout(
            ()=>p.remove(),
            700
        );
    }

    setTimeout(
        ()=>balloon.remove(),
        150
    );
}

surprise.onclick =
function(){

    surprise.style.display =
        "none";

    balloons.style.display =
        "none";

    cakeScene.style.display =
        "flex";

    setTimeout(function(){

        flame.style.display =
            "none";

        setTimeout(function(){

            cakeScene.style.display =
                "none";

            birthday.innerText =
                "HAPPY BIRTHDAY " +
                birthdayName.toUpperCase();

            birthday.style.display =
                "block";

            setTimeout(function(){

                birthday.style.display =
                    "none";

                showHeart();

            },3000);

        },500);

    },3000);
};

function showHeart(){

    const lowerName =
        birthdayName.toLowerCase();

    let text = "";

    for(let i=0;i<18;i++){

        text +=
            "happy birthday " +
            lowerName +
            " • ";

    }

    heartTextPath.textContent =
        text;

    heartBox.style.display =
        "flex";

    setTimeout(function(){

        heartBox.style.opacity =
            "1";

        heartBox.style.transform =
            "scale(1)";

    },100);

    setTimeout(function(){

        heartBox.style.opacity =
            "0";

        heartBox.style.transform =
            "scale(.7)";

        setTimeout(function(){

            heartBox.style.display =
                "none";

            showMessage();

        },1500);

    },5000);
}

function showMessage(){

    let title = "";
    let text = "";

    if(relationship === "boyfriend"){

        title =
            "💗 Happy Birthday " +
            birthdayName + "!";

        text =
            "Wishing you a very happy birthday filled with happiness, laughter and beautiful memories. May this new year of your life bring you success, peace and many amazing moments. Have a wonderful birthday and enjoy your special day! 🎂✨";
    }

    else if(relationship === "girlfriend"){

        title =
            "💕 Happy Birthday " +
            birthdayName + "!";

        text =
            "Wishing you a beautiful birthday filled with happiness, laughter and unforgettable memories. May every new day bring you wonderful opportunities, success and plenty of reasons to smile. Have an amazing birthday! 🎂✨";
    }

    else if(relationship === "bestfriend"){

        title =
            "🫶 Happy Birthday " +
            birthdayName + "!";

        text =
            "Happy Birthday to an amazing best friend! Wishing you endless happiness, lots of laughter, great adventures and countless beautiful memories. May this year be one of your best years ever! 🎂🎉";
    }

    else if(relationship === "friend"){

        title =
            "👯 Happy Birthday " +
            birthdayName + "!";

        text =
            "Wishing you an amazing birthday filled with happiness, laughter and good memories. May the year ahead bring you success, exciting opportunities and many wonderful moments. Have an awesome birthday! 🎂🎉";
    }

    else if(relationship === "brother"){

        title =
            "👦 Happy Birthday " +
            birthdayName + "!";

        text =
            "Wishing you a fantastic birthday and an incredible year ahead. May you always stay happy, successful and keep achieving your goals. Enjoy every moment of your special day! 🎂🎉";
    }

    else if(relationship === "sister"){

        title =
            "👧 Happy Birthday " +
            birthdayName + "!";

        text =
            "Wishing you lots of happiness, laughter and beautiful memories on your special day. May the coming year bring you success, wonderful opportunities and countless reasons to smile. Have the best birthday ever! 🎂💕";
    }

    messageTitle.innerText =
        title;

    messageText.innerText =
        text;

    message.style.display =
        "block";
}

</script>

</body>
</html>
